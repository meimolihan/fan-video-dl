services:
  fan-video-dl:
    image: mobufan/fan-video-dl:latest
    container_name: fan-video-dl
    restart: always
    ports:
      - "5200:5200"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PORT=5200
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin123
      # 生产环境请务必修改上面的默认账号密码!
      # 建议同时设置 SECRET_KEY=<随机字符>, 否则程序会自动生成并持久化到 data/secret_key
    tmpfs:
      - /tmp:size=2G
