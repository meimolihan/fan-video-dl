services:
  fan-video-dl:
    image: mobufan/fan-video-dl:latest
    container_name: fan-video-dl
    restart: always
    ports:
      - "5200:5200"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PORT=5200
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin123
      - SECRET_KEY=change-me-to-a-random-string
    tmpfs:
      - /tmp:size=2G
