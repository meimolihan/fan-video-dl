services:
  fan-video-dl:
    image: mobufan/fan-video-dl:latest
    container_name: fan-video-dl
    restart: always
    ports:
      - "5200:5200"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - PORT=5200
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin888}
      # 生产环境请务必修改上面的默认账号密码! (可写 .env 文件覆盖, 如 AUTH_PASSWORD=xxx)
      # 建议同时设置 SECRET_KEY=<随机字符>, 否则程序会自动生成并持久化到 data/secret_key
      # Bark 推送通知（可选，默认关闭）：
      - BARK_ENABLE=${BARK_ENABLE:-false}
      - BARK_KEY=${BARK_KEY:-}
      - BARK_SERVER=${BARK_SERVER:-https://api.day.app}
      # 其余可选参数：BARK_ICON / BARK_GROUP / BARK_SOUND_SUCCESS / BARK_SOUND_ERROR / BARK_SOUND_INFO / BARK_TIMEOUT
    tmpfs:
      - /tmp:size=2G
